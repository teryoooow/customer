appId: com.trackerteer.grg
---
- repeat:
    times: 50
    commands:
      - launchApp:
          permissions:
            notifications: unset # notification permission is unset
            android.permission.ACCESS_FINE_LOCATION: deny # Android fine location permission is denied
      - assertVisible:
          text: "Location Permission"
      - tapOn: "Proceed"
      - assertVisible:
          text: ".*location.*"
      - tapOn: "Change to precise location"
      - assertVisible:
          text: ".*Location Accuracy.*"
      - tapOn: "Turn on"
      - tapOn: "Change to precise location"
      - assertVisible:
          text: "Select another location"
      # - tapOn: "Use current location"
      # - tapOn: "Get Started"
      # - assertVisible:
      #     text: ".*notifications.*"
      # - tapOn: "Allow"